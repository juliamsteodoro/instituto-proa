<script>
       // 2.9  Leia o ano de nascimento e informe se a pessoa pode votar no ano atual (sem considerar o mês).
    var idade = Numberprompt("Insira o seu ano de nascimento: ")
    var able_to_vote = (2026 - idade);
    if(able_to_vote >= 18){
        alert("Você está apto para votar na eleição desse ano!")
    }else{
        alert("Você não está elegível para votar neste ano.")
    }

</script>
