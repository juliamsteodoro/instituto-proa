<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
       // 2.5 Leia 6 valores, exiba todos e calcule a média aritmética.
    var num1 = Number(prompt("Insira o valor do primeiro número"))
    var num2 = Number(prompt("Insira o valor do segundo número"))
    var num3 = Number(prompt("Insira o valor do terceiro número"))
    var num4 = Number(prompt("Insira o valor do quarto número"))
    var num5 = Number(prompt("Insira o valor do quinto número"))
    var num6 = Number(prompt("Insira o valor do sexto número"))
    
    var lista = [num1, num2, num3, num4, num5, num6];

    var soma = 0;
    for(var i = 0; i < lista.length; i++){
        soma += lista[i];
    }
    alert("Os valores fornecidos foram: " + lista.join(", ") + ". As somas desses valores é " + soma)

</script>
</html>
