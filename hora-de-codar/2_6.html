<script>
       // 2.6 Leia 4 valores diferentes e informe apenas o primeiro, o último e o maior deles.
    var num1 = Number(prompt("Insira o valor do primeiro número"))
    var num2 = Number(prompt("Insira o valor do segundo número"))
    var num3 = Number(prompt("Insira o valor do terceiro número"))
    var num4 = Number(prompt("Insira o valor do quarto número"))

    var maior = Math.max(num1, num2, num3, num4)

    alert("O primeiro número é " + num1 + " . O último número é " + num4 + ". O maior número é " + maior)

</script>
