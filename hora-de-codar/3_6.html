<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<script>
       // 3.6 Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.
    var nota1 = Number(prompt("Insira a primeira nota: "));
    while(nota1 > 10 && nota1 < 0){
        nota1 = Number(prompt("Insira a primeira nota: "));
    }
    var nota2 = Number(prompt("Insira a segunda nota: "));
    while(nota2 > 10 && nota2 < 0){
        nota2 = Number(prompt("Insira a segunda nota: "));
    }
    var nota3 = Number(prompt("Insira a terceira nota: "));
    while(nota3 > 10 && nota3 < 0){
        nota3 = Number(prompt("Insira a terceira nota: "));
    }
    var nota4 = Number(prompt("Insira a quarta nota: "));
    while(nota4 > 10 && nota4 < 0){
        nota4 = Number(prompt("Insira a quarta nota: "));
    }
    var nota5 = Number(prompt("Insira a quinta nota: "));
    while(nota5 > 10 && nota5 < 0){
        nota5 = Number(prompt("Insira a quinta nota: "));
    }
    var nota6 = Number(prompt("Insira a sexta nota: "));
    while(nota6 > 10 && nota6 < 0){
        nota6 = Number(prompt("Insira a sexta nota: "));
    }

    var media = ((nota1 + nota2 + nota3 + nota4 + nota5 + nota6) / 4);
    alert("A média das notas é: " + media);

</script>
</html>
