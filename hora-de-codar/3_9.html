<script>
       // 3.9 Leia 10 valores e informe quantos estão no intervalo de 24 a 42 (inclusive) e quantos estão fora.
    var intervalo = 0;
    var valor1 = Number(prompt("Insira um valor: "));
    if(valor1 >= 24 && valor1 <= 42){
        intervalo++;
    }
    var valor2 = Number(prompt("Insira um segundo valor: "));
    if(valor2 >= 24 && valor2 <= 42){
        intervalo++;
    }
    var valor3 = Number(prompt("Insira um terceiro valor: "));
    if(valor3 >= 24 && valor3 <= 42){
        intervalo++;
    }
    var valor4 = Number(prompt("Insira um quarto valor: "));
    if(valor4 >= 24 && valor4 <= 42){
        intervalo++;
    }
    var valor5 = Number(prompt("Insira um quinto valor: "));
    if(valor5 >= 24 && valor5 <= 42){
        intervalo++;
    }
    var valor6 = Number(prompt("Insira um sexto valor: "));
    if(valor6 >= 24 && valor6 <= 42){
        intervalo++;
    }
    var valor7 = Number(prompt("Insira um sétimo valor: "));
    if(valor7 >= 24 && valor7 <= 42){
        intervalo++;
    }
    var valor8 = Number(prompt("Insira um oitavo valor: "));
    if(valor8 >= 24 && valor8 <= 42){
        intervalo++;
    }
    var valor9 = Number(prompt("Insira um nono valor: "));
    if(valor9 >= 24 && valor9 <= 42){
        intervalo++;
    }
    var valor10 = Number(prompt("Insira um décimo valor: "));
    if(valor10 >= 24 && valor10 <= 42){
        intervalo++;
    }
    var n_intervalo = (10 - intervalo);
    alert("O número de valores que estão entre 24 e 42 é " + intervalo + ". O número de valores que não estão dentro desse intervalo é: " + n_intervalo)

</script>
</html>
