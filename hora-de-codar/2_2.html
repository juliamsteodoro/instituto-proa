<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
       // 2.2 Leia um valor e diga se ele é positivo, negativo ou zero.
    var numero = NumberNumber(prompt("Insira um valor(positivo, negativo ou zero.)"))

    if(numero > 0){
        alert("O número inserido é positivo")
    }else if(numero < 0){
        alert("O número inserido é negativo")
    }else{
        alert("O número inserido é zero.")
    }

</script>
</html>
