<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
       // 3.7 Leia um valor N (N > 0) e imprima todos os inteiros de 1 até N.
    var valor = Number(prompt("Insira um valor maior que 0: "))
    var count = 1;
    if(valor >= 0){
    while(count <= valor){
        alert(count);
        count++;
    }
    }else{
        alert("Valor inválido.")
    }

</script>
</html>
