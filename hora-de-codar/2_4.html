<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
       // 2.4 Leia 3 valores diferentes e mostre a soma dos 2 maiores.
    var numero1 = Number(prompt("Insira o valor do primeiro número"))
    var numero2 = Number(prompt("Insira o valor do segundo número"))
    var numero3 = Number(prompt("Insira o valor do terceiro número"))
    var menor = Math.min(numero1, numero2, numero3);
    var soma = (numero1 + numero2 + numero3) - menor;

    alert("A soma dos dois maiores números é " + soma);

</script>
</html>
