<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
let frutas = ["Jabuticaba", "Mirtilo", "Acerola", "Framboesa"];
while (frutas.length > 0) {
    alert(`Temos ${frutas.length} frutas disponíveis: ${frutas.join(", ")}`);
    
    let entrada = prompt("Que fruta deseja remover? (ou digite PARE para sair)");
    let frutaDigitada = entrada.trim().toUpperCase();
    if (frutaDigitada === "PARE") {
        alert(`Lista de frutas restantes: ${frutas.join(", ")}`);
        break;
    }

    let indice = frutas.findIndex(f => f.toUpperCase() === frutaDigitada);
    if (indice !== -1) {
        frutas.splice(indice, 1);
        alert("Fruta foi retirada da lista");
    } else {
        alert("Fruta indisponível no nosso mercado");
    }
}

if (frutas.length === 0) {
    alert("Lista de compras finalizada");
}
</script>
</html>
