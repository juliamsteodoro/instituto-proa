<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let contatos = [];
    function adicionarContato() {
        let nome = prompt("Digite o nome do contato:").trim();
        let telefone = prompt("Digite o telefone do contato:").trim();
        contatos.push({ nome, telefone });
        alert("Contato adicionado com sucesso!");
    }

    function buscarContato() {
        let nome = prompt("Digite o nome que deseja buscar:").trim().toUpperCase();
        let contato = contatos.find(c => c.nome.toUpperCase() === nome);
        
        if (contato) {
            alert(`CONTATO ENCONTRADO:\nNome: ${contato.nome}\nTelefone: ${contato.telefone}`);
        } else {
            alert("Contato não encontrado!");
        }
    }

    function removerContato() {
        let nome = prompt("Digite o nome do contato que deseja remover:").trim().toUpperCase();
        let indice = contatos.findIndex(c => c.nome.toUpperCase() === nome);
        
        if (indice !== -1) {
            alert(`Contato [${contatos[indice].nome}] removido com sucesso!`);
            contatos.splice(indice, 1);
        } else {
            alert("Contato não encontrado.");
        }
    }

    function listarContatos() {
        if (contatos.length === 0) {
            alert("Nenhum contato registado.");
            return;
        }
        
        let lista = contatos.map(c => `${c.nome} | ${c.telefone}`).join("\n");
        alert(`CONTATOS REGISTADOS\n\n${lista}`);
    }

    while (true) {
        let menu = "AGENDA DE CONTATOS\n\nEscolha uma opção:\nADICIONAR\nBUSCAR\nREMOVER\nLISTAR\nSAIR";
        let comando = prompt(menu).toUpperCase().trim();

        if (comando === "SAIR") {
            alert(`Agenda encerrada!\nTotal de contatos: ${contatos.length}`);
            break;
        }

        switch (comando) {
            case "ADICIONAR": adicionarContato(); break;
            case "BUSCAR": buscarContato(); break;
            case "REMOVER": removerContato(); break;
            case "LISTAR": listarContatos(); break;
            default: alert("Comando inválido!");
        }
    }
</script>
</body>
</html>
